[package]
name = "unlp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ast-grep-core = "0.45"
ast-grep-language = { version = "0.45", default-features = false, features = [
  "tree-sitter-rust",
  "tree-sitter-python",
  "tree-sitter-typescript",
  "tree-sitter-javascript",
  "tree-sitter-go",
] }
clap = { version = "4.6.7", features = ["derive"] }
lindera = { version = "6", features = ["embed-unidic"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
